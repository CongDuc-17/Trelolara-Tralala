<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shark-fin-svgrepo-com.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trelolara</title>
    <script>
      try {
        let theme = localStorage.getItem("trelolara-theme");
        if (!["light", "dark", "system"].includes(theme)) {
          theme = "system";
          localStorage.removeItem("trelolara-theme");
        }
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.documentElement.lang = localStorage.getItem("trelolara-language") === "en" ? "en" : "vi";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
